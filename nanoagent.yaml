_ > nanoagent.plugin.manifest.ManifestConfig:
id: file-organizer
name: File Organizer
version: 0.2.0
status: ready
nanoagent: ~=0.5.0

runtime > nanoagent.plugin.manifest.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.manifest.PermissionsConfig:
  network > nanoagent.plugin.manifest.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.manifest.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.manifest.ToolConfig]:
  pin_layout:
    description: Read every file in a copy of the folder, apply the rules and pin each file's facts and the step the rules give it; the task's answer key
  survey:
    description: List this run's files to act on, at most 60 in the rules' order, each with its number i, the start of its sha256 (h), where the rules file it (base) and whether to drop it; the first call of a run fixes the rows
  apply:
    description: Delete rows by i, and move rows to the n-th free name of their base, in this run's rows only; a refused item is reported and the others are done; it never deletes the last copy of anything

# One entry per contract.Task; its input and output classes are contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.manifest.TaskConfig]:
  organize-folder:
    description: Tidy a folder of the member's own files by the File Organizer rules, deleting exact duplicates, junk and empty files and filing every other file under organized/<group>/<type>/<YYYY>/<YYYY-MM-DD>_<slug>.<ext>
    runner: agent
    tools: [survey, apply]
    reference: pin_layout
    instructions: |-
      1. Call survey with the task's folder. It lists this run's files (at most 60) in order of i: path, h (rows with the same h hold the same bytes), base (where the rules file it) and drop.
      2. Decide each row in order, one short line each, no prose: a row with drop: delete it; otherwise, if an earlier row without drop has the same h: delete it (the earliest copy stays); otherwise move it, with n = 1 + how many earlier rows you are moving with the same base.
      3. Apply in two calls: the first 30 rows, then the rest (one call when there are 30 or fewer). Moves are {i, n}; deletes are i. If a call reports errors, fix only those in one more call.
      4. Call submit with the summary of your last survey or apply call, exactly as returned.
