_ > nanoagent.plugin.manifest.ProductConfig:
tagline: "Tidy your own folder: drop exact duplicates and junk, then file everything by its content and date"
summary: "Upload a messy folder of your own files to the agent folder and ask the chat to organize it. The agent deletes exact duplicates, junk and empty files and files everything else under organized/<group>/<type>/<year>/<date>_<name>.<ext>, by rules that read each file's real content and embedded date. A static verifier then checks every file by its hash and path against an answer key pinned before the agent started."
highlights:
  - "About 35 real formats sniffed from their bytes, never from the name: photos, documents, audio, video, archives, data and code"
  - "Dates from EXIF, PDF, Office and OpenDocument properties, MP4 headers and front matter, else the file name; never modification times"
  - "Duplicates found by content alone, the last copy of anything is never deleted, and every check is listed in the result"
  - "One run does up to 60 actions; a bigger folder continues with the same rules when you ask again"
steps:
  - "Upload the files to organize into a folder of your File Organizer agent folder, for example Downloads"
  - "Ask the chat to organize that folder (or . for the whole agent folder)"
  - "The agent lists this run's files, decides which copies stay and how names that collide are numbered, then moves and deletes"
  - "See what happened to every file and every check the verifier made; ask again if more remains"
